name: CI

on:
  pull_request:
    paths:
      - "**/*.[jt]sx?"  # .js, .ts, .jsx, .tsx
      - "**/*.[ecm]js"  # .ejs, .cjs, .mjs
      - "**/*.json"
      - "**/*.ya?ml"    # .yml, .yaml
  # Pushes to main run CI through publish.yml, before releasing.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    #runs-on: ${{ matrix.os }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [22.x, 24.x, 26.x]
        #os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install deps
        run: pnpm install

      - name: Format
        run: pnpm run format

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test
