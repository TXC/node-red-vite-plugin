name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "12 18 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # JavaScript/TypeScript is analyzed from source; no build step needed.
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: +security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
