name: Publish Package

# semantic-release decides per package whether anything is released,
# and tags each release as `<package>-v<version>`.
on:
  push:
    branches:
      - main

# One release at a time; a queued run picks up the previous run's tags.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # release commits and tags
  issues: write # comments on released issues
  pull-requests: write # comments on released pull requests
  id-token: write # npm provenance

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.repository == 'TXC/node-red-vite-plugin'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install deps
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Semantic Release
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed until npm trusted publishing is set up for the package.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
